version: 2

sources:
  - name: sigma_analytics
    database: SIGMA_DE
    schema: PUBLIC
    tables:
      - name: fact_transactions
        description: "Raw transaction table"
      - name: dim_merchant
        description: "Raw merchant data"

models:
  - name: stg_transactions
    description: "Cleaned and cast transaction data"
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: amount
        tests:
          - not_null
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['COMPLETED', 'FAILED']
      - name: payment_method
        tests:
          - not_null
          - accepted_values:
              values: ['CREDIT_CARD', 'DEBIT_CARD', 'UPI']

  - name: stg_merchants
    description: "Cleaned merchant records"
    columns:
      - name: merchant_id
        tests:
          - not_null
          - unique
